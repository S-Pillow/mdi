# Example tmpfiles.d rule for VT usage history permissions (VTFIX-02E).
#
# Purpose:
#   On boot and after "systemd-tmpfiles --create", adjust ownership/mode on the
#   existing JSONL file so group dns-tool retains write access even if a prior
#   root cleanup recreated the file as root:dns-tool 0644.
#
# Safety:
#   Type "z" adjusts mode/ownership on an EXISTING path only.
#   It does NOT truncate, delete, or overwrite file contents.
#   If the path does not exist, no operation is performed.
#
# NOT installed automatically. Copy manually after review:
#   sudo cp docs/deployment/vt-usage-history-perms.example.tmpfiles.conf \
#          /etc/tmpfiles.d/dns-tool-vt-usage-history.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/dns-tool-vt-usage-history.conf
#
# Verify metadata only (never cat the JSONL):
#   stat /var/lib/dns-tool/vt_usage_history.jsonl
#   sudo -u www-data test -w /var/lib/dns-tool/vt_usage_history.jsonl
#   sudo -u mdi test -w /var/lib/dns-tool/vt_usage_history.jsonl

z /var/lib/dns-tool/vt_usage_history.jsonl 0664 www-data dns-tool -
